kind = "web"
previewPath = "/"
title = "LogicLens"
version = "1.0.0"
id = "artifacts/logiclens"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23550

[services.development]
run = "pnpm --filter @workspace/logiclens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/logiclens", "run", "build" ]
publicDir = "artifacts/logiclens/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23550"
BASE_PATH = "/"
